[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheafint"
version = "0.1.0"
description = "Sheaf cohomology for transformer interpretability and steering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Bryce Grant", email = "bag100@case.edu" },
    { name = "Peng Wang" },
]
keywords = ["interpretability", "sheaf", "cohomology", "transformer", "steering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "tqdm>=4.65",
]

[project.optional-dependencies]
llm = [
    "transformers>=4.30",
    "datasets>=2.10",
    "bitsandbytes>=0.41",
    "accelerate>=0.20",
    "concept-erasure>=0.2",
    "sentence-transformers>=2.2",
    "tyro>=0.8",
]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sheafint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
